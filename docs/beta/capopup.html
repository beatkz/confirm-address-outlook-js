<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>あて先メールアドレスの確認</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="ed79b3fb08fc2a422efd.css">
<script defer src="capopup.js"></script></head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans p-5 text-sm">
  <div class="container mx-auto max-w-2xl">
    <h1 class="text-xl font-bold mb-4">あて先メールアドレスを確認してください。</h1>
    <p class="mb-4">※宛先の編集に戻るにはキャンセルボタンをクリックします。</p>
    <div class="form-group space-y-4" id="caPopup">
      <div id="insiderContainer" hidden>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="batchCheck_insiderReci" id="batchCheck_insiderReci" disabled>
          <label for="batchCheck_insiderReci" class="text-base font-semibold">
            組織内へのメール
          </label>
        </div>
        <div id="insiderReci" class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md p-2 text-gray-900 dark:text-gray-100 min-h-0 max-h-48 overflow-y-auto">
          読み込み中...
        </div>
      </div>
      <div id="outsiderContainer" hidden>
        <div class="flex items-center gap-2">
          <label for="batchCheck_outsiderReci" class="text-base font-semibold">
            組織外へのメール
          </label>
        </div>
        <div id="outsiderReci" class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md p-2 text-gray-900 dark:text-gray-100 min-h-0 max-h-48 overflow-y-auto">
          読み込み中...
        </div>
      </div>
      <div id="mailBodyContainer" hidden>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="check_firstLinesOfBody" id="check_firstLinesOfBody">
          <label for="check_firstLinesOfBody" class="text-base font-semibold">
            メール本文の冒頭数行
          </label>
        </div>
        <pre id="body" class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md p-2 text-gray-900 dark:text-gray-100 h-24 overflow-y-auto">
          読み込み中...
        </pre>
      </div>
      <div id="attNamesContainer" hidden>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="batchCheck_Attachments" id="batchCheck_Attachments" disabled>
          <label for="batchCheck_Attachments" class="text-base font-semibold">
            添付ファイル名
          </label>
        </div>
        <div id="attNames" class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md p-2 text-gray-900 dark:text-gray-100 min-h-0 max-h-48 overflow-y-auto">
          読み込み中...
        </div>
      </div>
    </div>
    <div id="countdown" class="text-center mb-2"></div>
    <div class="buttons flex justify-end space-x-2 mt-6">
      <button id="btn_cancel" class="bg-red-500 hover:bg-red-600 dark:bg-red-600 dark:hover:bg-red-700 text-white font-medium py-2 px-4 rounded-md text-sm">キャンセル</button>
      <button id="btn_send" class="bg-gray-500 hover:bg-gray-600 dark:bg-gray-600 dark:hover:bg-gray-700 text-white font-medium py-2 px-4 rounded-md disabled:opacity-50 text-sm" disabled>送信</button>
    </div>
  </div>
</body>
</html>
