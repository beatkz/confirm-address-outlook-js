<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>Mail Confirmation Settings</title><link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"><link rel="stylesheet" href="945398b1e0c80db9d26b.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script defer="defer" src="settings.min.js"></script></head><body class="ms-Fabric dark is-dark"><h1 class="ms-font-xl ms-fontWeight-semibold mb-4">メール送信確認設定</h1><form id="settingsForm" class="form-group"><div class="form-group"><label for="insiderDomains" class="ms-Label">自組織ドメイン名（カンマ区切りで複数指定）</label> <input id="insiderDomains" name="insiderDomains" class="ms-TextField-field" placeholder="example.com, company.org" style="width:100%;margin-top:4px"></div><div class="form-group"><label class="ms-Checkbox"><input type="checkbox" id="noDisplayInsiderDomainOnly" name="noDisplayInsiderDomainOnly"> 自ドメイン宛てのメール送信時は確認ダイアログを表示しない</label></div><div class="form-group inline-flex-group"><label class="ms-Checkbox"><input type="checkbox" id="countDown" name="countDown"> [送信]ボタン押下後にカウントダウンを開始する</label> <input type="number" id="countDownTime" name="countDownTime" min="1" max="60" class="inline-input" placeholder="5"> <span class="ms-font-m">秒</span></div><div class="form-group inline-flex-group"><label class="ms-Checkbox"><input type="checkbox" id="confirmMailBody" name="confirmMailBody"> 本文の冒頭行を表示する</label> <input type="number" id="confirmMailBodyLines" name="confirmMailBodyLines" min="1" max="15" class="inline-input" placeholder="5"> <span class="ms-font-m">行</span></div><div class="form-group"><label class="ms-Checkbox"><input type="checkbox" id="insiderDomainBatchCheck" name="insiderDomainBatchCheck"> 自ドメインの一括チェックボタンを有効にする</label></div><button type="submit" id="submitButton" class="ms-Button ms-Button--primary">保存</button></form></body></html>
