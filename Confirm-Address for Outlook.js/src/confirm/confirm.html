<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>送信確認</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="confirm.js"></script>
  <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
  <div class="container">
    <h2>送信確認</h2>
    <div class="details">
      <p>
        <h3>To:</h3>
        <pre id="toReci">読み込み中...</pre>
        
        <h3>Cc:</h3>
        <pre id="ccReci">読み込み中...</pre>

        <h3>Bcc:</h3>
        <pre id="bccReci">読み込み中...</pre>
      </p>
      <p>
        <h3>本文 (冒頭):</h3>
        <pre id="body">読み込み中...</pre>
      </p>
      <p>
        <h3>添付ファイル:</h3>
        <pre id="attNames">読み込み中...</pre>
      </p>
    </div>
    <div class="buttons">
      <button onclick="cancelSend()">キャンセル</button>
      <button onclick="confirmSend()">送信</button>
    </div>
  </div>
</body>
</html>
