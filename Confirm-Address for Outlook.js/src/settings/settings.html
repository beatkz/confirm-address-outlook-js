<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mail Confirmation Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/bin/common.css">
</head>
<body>
  <h1 class="text-2xl font-bold mb-4">メール送信確認設定</h1>
  <form id="settingsForm" class="space-y-4">
    <div class="form-group">
      <label for="insiderDomains" class="block text-sm font-medium">自組織ドメイン名（カンマ区切りで複数指定）</label>
      <input type="text" id="insiderDomains" name="insiderDomains" class="mt-1 block w-full" placeholder="example.com, company.org">
      <p id="domainsErr" class="error text-sm mt-1 hidden">有効なドメインを入力してください</p>
    </div>
    <div class="form-group">
      <label class="flex items-center">
        <input type="checkbox" id="noDisplayInsiderDomainOnly" name="noDisplayInsiderDomainOnly" class="mr-2">
        自ドメイン宛てのメール送信時は確認ダイアログを表示しない
      </label>
    </div>
    <div class="form-group inline-flex-group">
      <label class="flex items-center">
        <input type="checkbox" id="countDown" name="countDown" class="mr-2">
        [送信]ボタン押下後にカウントダウンを開始する
      </label>
      <input type="number" id="countDownTime" name="countDownTime" min="1" max="60" class="inline-input" placeholder="5">
      <span>秒</span>
      <p id="countdownErr" class="error text-sm mt-1 w-full hidden">1～60秒の範囲で指定してください</p>
    </div>
    <div class="form-group inline-flex-group">
      <label class="flex items-center">
        <input type="checkbox" id="confirmMailBody" name="confirmMailBody" class="mr-2">
        本文の冒頭行を表示する
      </label>
      <input type="number" id="confirmMailBodyLines" name="confirmMailBodyLines" min="1" max="15" class="inline-input" placeholder="5">
      <span>行</span>
      <p id="bodyLinesErr" class="error text-sm mt-1 w-full hidden">1～15行の範囲で指定してください</p>
    </div>
    <div class="form-group">
      <label class="flex items-center">
        <input type="checkbox" id="insiderDomainBatchCheck" name="insiderDomainBatchCheck" class="mr-2">
        自ドメインの一括チェックボタンを有効にする
      </label>
    </div>
    <div class="form-group">
      <label class="flex items-center">
        <input type="checkbox" id="outsiderDomainBatchCheck" name="outsiderDomainBatchCheck" class="mr-2">
        他ドメインの一括チェックボタンを有効にする
      </label>
    </div>
    <div class="form-group">
      <label class="flex items-center">
        <input type="checkbox" id="attachmentBatchCheck" name="attachmentBatchCheck" class="mr-2">
        添付ファイル名の一括チェックボタンを有効にする
      </label>
    </div>
    <button type="submit" id="submitButton" class="bg-blue-500 text-white px-4 py-2">保存</button>
  </form>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="settings.js"></script>
</body>
</html>
