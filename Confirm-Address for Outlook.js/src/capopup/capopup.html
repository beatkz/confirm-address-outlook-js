<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>あて先メールアドレスの確認</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css">
  <link rel="stylesheet" href="/assets/bin/common.css">
</head>
<body class="ms-Fabric dark is-dark">
  <div class="ms-Fabric" style="max-width: 700px; margin: 0 auto;">
    <h1 class="ms-font-xl ms-fontWeight-semibold mb-4">あて先メールアドレスを確認してください。</h1>
    <p class="ms-font-m mb-4">※宛先の編集に戻るにはキャンセルボタンをクリックします。</p>
    <div class="form-group" id="caPopup">
      <div id="SenderAddressContainer" hidden>
        <div class="inline-flex-group">
          <input type="checkbox" name="chkSenderAddress" id="chkSenderAddress" class="ms-Checkbox">
          <label for="chkSenderAddress" class="ms-Label">差出人</label>
        </div>
        <div id="SenderAddress" class="address-list">
          読み込み中...
        </div>
      </div>
      <div id="insiderContainer" hidden>
        <div class="inline-flex-group">
          <input type="checkbox" name="batchCheck_insiderReci" id="batchCheck_insiderReci" disabled class="ms-Checkbox">
          <label for="batchCheck_insiderReci" class="ms-Label">組織内へのメール</label>
        </div>
        <div id="insiderReci" class="address-list">
          読み込み中...
        </div>
      </div>
      <div id="outsiderContainer" hidden>
        <div class="inline-flex-group">
          <label class="ms-Label">組織外へのメール</label>
        </div>
        <div id="outsiderReci" class="address-list">
          読み込み中...
        </div>
      </div>
      <div id="mailBodyContainer" hidden>
        <div class="inline-flex-group">
          <input type="checkbox" name="check_firstLinesOfBody" id="check_firstLinesOfBody" class="ms-Checkbox">
          <label for="check_firstLinesOfBody" class="ms-Label">メール本文の冒頭数行</label>
        </div>
        <pre id="body" class="address-list h-24">
          読み込み中...
        </pre>
      </div>
      <div id="attNamesContainer" hidden>
        <div class="inline-flex-group">
          <label class="ms-Label">添付ファイル名</label>
        </div>
        <div id="attNames" class="address-list">
          読み込み中...
        </div>
      </div>
    </div>
    <div id="countdown" class="text-center mb-2"></div>
    <div class="buttons flex justify-end gap-2 mt-6">
      <button id="btn_cancel" class="ms-Button bg-red-500">キャンセル</button>
      <button id="btn_send" class="ms-Button bg-gray-500" disabled>送信</button>
    </div>
  </div>
</body>
</html>
